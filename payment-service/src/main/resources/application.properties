spring.application.name=payment-service
server.port=8006
spring.datasource.url=jdbc:mysql://localhost:3306/hospital
spring.datasource.username=${MYSQL_ROOT_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

# Eureka service discovery
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8001/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Stripe test-mode credentials: set environment variables; never commit real secrets.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.currency=inr
app.frontend.success-url=${FRONTEND_SUCCESS_URL:http://localhost:5173/payment/success?session_id={CHECKOUT_SESSION_ID}}
app.frontend.cancel-url=${FRONTEND_CANCEL_URL:http://localhost:5173/payment/cancel}

# Local Kafka cluster. For a single broker, change this to localhost:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
