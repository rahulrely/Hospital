spring.application.name=gateway-service
server.port=8050
# =========================
# Eureka
# =========================

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ===============================
# Gateway Routes
# ===============================

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[1].id=notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://NOTIFOCATION
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notifications/**


#spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1


# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only